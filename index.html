<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regioni d’Italia – il gioco delle regioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#BFE0EE; --sea-deep:#9CCBE0; --land:#F8EBC2; --land-hover:#FFE08A; --edge:#FFFFFF;
  --pick:#F2B632; --pick-edge:#7A4E00;
  --good:#3F9A5E; --later:#E8913A; --bad:#D2463C;
  --ink:#16324A; --ink-soft:#4A6378; --panel:#FFFFFF; --panel-edge:#9CCBE0; --field:#F4FAFD;
  --btn:#16324A; --btn-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0E2838; --sea-deep:#16384D; --land:#3B3A2C; --land-hover:#6B5B22; --edge:#0E2838;
    --pick:#F2B632; --pick-edge:#FFE7A8;
    --good:#4FB073; --later:#E8913A; --bad:#E2604F;
    --ink:#E9F2F8; --ink-soft:#A8BDCC; --panel:#132F42; --panel-edge:#24506B; --field:#0E2838;
    --btn:#F2B632; --btn-ink:#16324A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0E2838; --sea-deep:#16384D; --land:#3B3A2C; --land-hover:#6B5B22; --edge:#0E2838;
  --pick:#F2B632; --pick-edge:#FFE7A8;
  --good:#4FB073; --later:#E8913A; --bad:#E2604F;
  --ink:#E9F2F8; --ink-soft:#A8BDCC; --panel:#132F42; --panel-edge:#24506B; --field:#0E2838;
  --btn:#F2B632; --btn-ink:#16324A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background:var(--sea); color:var(--ink);
  font-family:"Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  font-size:18px; line-height:1.4; min-height:100vh;
}
.wrap{max-width:1080px; margin:0 auto; padding:16px 16px 32px;
  display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:24px; align-items:start}
header{grid-column:1/-1; display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px 20px}
h1{margin:0; font-size:clamp(2rem,5vw,3.2rem); font-weight:700; letter-spacing:-.01em; line-height:1}
h1 .flag{display:inline-flex; gap:3px; vertical-align:middle; margin-left:10px; transform:translateY(-4px)}
h1 .flag i{display:block; width:10px; height:26px; border-radius:3px}
h1 .flag i:nth-child(1){background:#2E8B57} h1 .flag i:nth-child(2){background:#fff; box-shadow:inset 0 0 0 1px #ccd} h1 .flag i:nth-child(3){background:#CE2B37}
.sub{margin:0; color:var(--ink-soft); font-size:1.05rem}

.mapbox{position:relative}
svg.map{width:100%; height:auto; max-height:calc(100vh - 140px); display:block; margin:0 auto; overflow:visible}
.reg{fill:var(--land); stroke:var(--edge); stroke-width:1.6; stroke-linejoin:round; cursor:pointer; transition:fill .25s}
.reg:hover{fill:var(--land-hover)}
.reg.pick{fill:var(--pick); stroke:var(--pick-edge); stroke-width:2.4}
.reg.first{fill:var(--good)}
.reg.later{fill:var(--later)}
.reg.first:hover,.reg.later:hover{filter:brightness(1.08)}
.reg:focus{outline:none}
.reg:focus-visible{stroke:var(--ink); stroke-width:3}
.reg.flash{animation:flash .7s ease}
@keyframes flash{0%{stroke-width:2.4} 40%{stroke-width:7; stroke:#fff} 100%{stroke-width:1.6}}
.tick{pointer-events:none; fill:#fff; font-size:15px; font-weight:700; text-anchor:middle; dominant-baseline:central}

.panel{background:var(--panel); border:2px solid var(--panel-edge); border-radius:22px; padding:22px; position:sticky; top:calc(16px + env(safe-area-inset-top,0px))}
.progress{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.bar{flex:1; height:14px; background:var(--field); border-radius:99px; overflow:hidden; border:1px solid var(--panel-edge); display:flex}
.bar span{display:block; height:100%; transition:width .4s}
.bar .b1{background:var(--good)} .bar .b2{background:var(--later)}
.count{font-weight:600; white-space:nowrap}
.ask{font-size:1.35rem; font-weight:600; margin:0 0 4px}
.hint{color:var(--ink-soft); margin:0 0 14px; min-height:1.4em}
.row{display:flex; gap:8px}
input[type=text]{
  flex:1; min-width:0; font:inherit; font-size:1.25rem; padding:12px 14px; border-radius:14px;
  border:2px solid var(--panel-edge); background:var(--field); color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--pick)}
input.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)}}
button{font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:14px; padding:12px 18px; background:var(--btn); color:var(--btn-ink)}
button:focus-visible{outline:3px solid var(--pick); outline-offset:2px}
button.ghost{background:transparent; color:var(--ink); border:2px solid var(--panel-edge)}
button:disabled{opacity:.45; cursor:default}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.fb{margin-top:16px; padding:12px 14px; border-radius:14px; font-size:1.1rem; display:none}
.fb.show{display:block}
.fb.ok{background:color-mix(in srgb,var(--good) 18%,transparent); border:2px solid var(--good)}
.fb.no{background:color-mix(in srgb,var(--bad) 14%,transparent); border:2px solid var(--bad)}
.fb.info{background:var(--field); border:2px solid var(--panel-edge)}
.fb b{font-weight:700}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:18px; font-size:.9rem; color:var(--ink-soft)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:14px; border-radius:4px; display:inline-block}
.reset{margin-top:14px; background:none; color:var(--ink-soft); padding:4px 0; font-weight:500; text-decoration:underline; font-size:.9rem}
.done h2{margin:0 0 6px; font-size:1.8rem}
.done p{margin:0 0 12px}
.big{font-size:3rem; line-height:1; margin:4px 0 10px}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr; gap:14px}
  svg.map{max-height:62vh}
  .panel{position:static}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Regioni d’Italia<span class="flag" aria-hidden="true"><i></i><i></i><i></i></span></h1>
    <p class="sub">Tocca una regione e scrivi il suo nome.</p>
  </header>

  <div class="mapbox">
    <svg class="map" id="map" viewBox="0 0 600 788" role="img" aria-label="Cartina dell’Italia con 20 regioni"></svg>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="progress">
      <div class="bar" aria-hidden="true"><span class="b1" id="b1" style="width:0"></span><span class="b2" id="b2" style="width:0"></span></div>
      <div class="count" id="count">0 su 20</div>
    </div>
    <div id="stage"></div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>al primo colpo</span>
      <span><i style="background:var(--later)"></i>con aiuto</span>
      <span><i style="background:var(--land); outline:1px solid var(--panel-edge)"></i>da indovinare</span>
    </div>
    <button class="reset" id="reset">Ricomincia da capo</button>
  </aside>
</div>

const NS = "http://www.w3.org/2000/svg";
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");
const EXTRA = {
  2:["valdaosta","valledaostavalleedaoste"],
  4:["trentinoaltoadigesudtirol","trentinosudtirol","trentinoaltoadigesuedtirol"],
  6:["friuliveneziagiulia","friulivenezziagiulia"]
};
const R = DATA.regions;
R.forEach(r => { r.ok = [norm(r.name), ...(EXTRA[r.id]||[])]; });
const byId = Object.fromEntries(R.map(r=>[r.id,r]));

function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i];
    for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c; }
  return p[n];
}

// ----- state -----
const KEY="regioni-v1";
let S = {solved:{}, tries:{}, help:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
let current=null;

// ----- map -----
const svg=document.getElementById("map");
const els={}, ticks={};
R.forEach(r=>{
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d",r.d); p.setAttribute("class","reg");
  p.setAttribute("tabindex","0"); p.setAttribute("role","button");
  p.setAttribute("aria-label","Regione "+r.id);
  p.addEventListener("click",()=>pick(r.id));
  p.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(r.id);} });
  svg.appendChild(p); els[r.id]=p;
});
R.forEach(r=>{
  const t=document.createElementNS(NS,"text");
  t.setAttribute("x",r.cx); t.setAttribute("y",r.cy); t.setAttribute("class","tick");
  t.textContent="✓"; t.style.display="none"; svg.appendChild(t); ticks[r.id]=t;
});

function paint(){
  R.forEach(r=>{
    const p=els[r.id], st=S.solved[r.id];
    p.classList.toggle("first",st==="first");
    p.classList.toggle("later",st==="later");
    p.classList.toggle("pick",current===r.id && !st);
    ticks[r.id].style.display = st ? "" : "none";
    let tt=p.querySelector("title");
    if(st){ if(!tt){tt=document.createElementNS(NS,"title");p.appendChild(tt);} tt.textContent=r.name; p.setAttribute("aria-label",r.name); }
    else if(tt){ tt.remove(); p.setAttribute("aria-label","Regione "+r.id); }
  });
  const f=R.filter(r=>S.solved[r.id]==="first").length, l=R.filter(r=>S.solved[r.id]==="later").length;
  document.getElementById("b1").style.width=(f/20*100)+"%";
  document.getElementById("b2").style.width=(l/20*100)+"%";
  document.getElementById("count").textContent=(f+l)+" su 20";
}

// ----- panel -----
const stage=document.getElementById("stage");
const open=()=>R.filter(r=>!S.solved[r.id]);

function idle(msg){
  current=null; paint();
  if(!open().length) return finish();
  stage.innerHTML=`
    <p class="ask">Che regione è questa?</p>
    <p class="hint">Tocca una regione sulla cartina.</p>
    <div class="actions"><button id="rnd">Scegli tu una regione</button></div>
    ${msg?`<div class="fb show ${msg.cls}">${msg.html}</div>`:""}`;
  document.getElementById("rnd").onclick=randomPick;
}

function randomPick(){
  const o=open().filter(r=>r.id!==current);
  const pool=o.length?o:open();
  if(pool.length) pick(pool[Math.floor(Math.random()*pool.length)].id);
}

function pick(id, keepMsg){
  const r=byId[id];
  if(S.solved[id]){
    current=null; paint();
    stage.innerHTML=`<p class="ask">${r.name}</p>
      <p class="hint">Questa regione l’hai già indovinata.</p>
      <div class="actions"><button id="rnd">Prossima regione</button></div>`;
    document.getElementById("rnd").onclick=randomPick;
    return;
  }
  current=id; paint();
  const tries=S.tries[id]||0;
  stage.innerHTML=`
    <p class="ask">Come si chiama la regione gialla?</p>
    <p class="hint" id="hint">${hintText(r,tries)}</p>
    <form id="f" class="row" autocomplete="off">
      <input type="text" id="inp" placeholder="Nome della regione" aria-label="Nome della regione" autocapitalize="words" spellcheck="false">
      <button type="submit">Controlla</button>
    </form>
    <div class="actions">
      <button type="button" class="ghost" id="tip">Aiuto</button>
      <button type="button" class="ghost" id="skip">Un’altra regione</button>
    </div>
    <div class="fb" id="fb"></div>`;
  const inp=document.getElementById("inp");
  document.getElementById("f").onsubmit=e=>{ e.preventDefault(); check(); };
  document.getElementById("tip").onclick=()=>{ S.help[id]=true; S.tries[id]=Math.max(S.tries[id]||0,0)+1; save(); refreshHint(); inp.focus(); };
  document.getElementById("skip").onclick=randomPick;
  if(keepMsg) showFb(keepMsg.cls,keepMsg.html);
  inp.focus({preventScroll:window.innerWidth>860});
}

function hintText(r,tries){
  const n=r.name;
  if(tries<=0) return "Scrivi il nome della regione.";
  if(tries===1) return `Aiuto: comincia con la lettera «${n[0]}».`;
  if(tries===2){
    const show=Math.ceil(n.length/2);
    return "Aiuto: "+[...n].map((c,i)=> i<show||/[ '\-]/.test(c) ? c : "_").join("");
  }
  return `Si chiama «${n}». Scrivila una volta e te la ricorderai!`;
}
function refreshHint(){ if(current) document.getElementById("hint").textContent=hintText(byId[current],S.tries[current]||0); }

function showFb(cls,html){ const fb=document.getElementById("fb"); if(!fb) return; fb.className="fb show "+cls; fb.innerHTML=html; }

function check(){
  const id=current; if(!id) return;
  const r=byId[id], inp=document.getElementById("inp");
  const g=norm(inp.value);
  if(!g){ showFb("info","Prima scrivi un nome nella casella."); inp.focus(); return; }
  const exact=r.ok.includes(g);
  const close=!exact && g.length>=5 && r.ok.some(a=>lev(a,g)<=1);
  if(exact||close){
    const first=!(S.tries[id]>0) && !S.help[id];
    S.solved[id]= first ? "first" : "later"; save();
    els[id].classList.remove("flash"); void els[id].getBBox(); els[id].classList.add("flash");
    const praise=first?["Bravissimo!","Perfetto!","Giusto!","Bravo!","Fantastico!"]:["Bravo!","Ecco!","Giusto!"];
    const p=praise[Math.floor(Math.random()*praise.length)];
    let html=`<b>${p}</b> È proprio <b>${r.name}</b>.`;
    if(close) html+=` Si scrive così: <b>${r.name}</b>.`;
    if(!open().length){ current=null; paint(); return finish(); }
    idle({cls:"ok",html:html+" Avanti con la prossima regione!"});
    return;
  }
  S.tries[id]=(S.tries[id]||0)+1; save();
  inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
  const other=R.find(o=>o.id!==id && o.ok.includes(g));
  let html = other
    ? `<b>${other.name}</b> esiste, ma è un’altra regione. Riprova!`
    : (S.tries[id]>=3 ? "Non proprio. Guarda il nome qui sopra e copialo." : "No, peccato. Riprova!");
  showFb("no",html); refreshHint(); inp.select();
}

function finish(){
  const f=R.filter(r=>S.solved[r.id]==="first").length;
  const msg = f===20 ? "Tutte e 20 al primo colpo. Sei un vero esperto d’Italia!"
            : f>=15 ? "Bravissimo! Ancora un giro e le saprai tutte a memoria."
            : "Ben fatto! Gioca ancora e le regioni verdi saranno di più.";
  stage.innerHTML=`<div class="done">
    <div class="big" aria-hidden="true">🏆</div>
    <h2>Hai finito!</h2>
    <p>Ne hai indovinate subito <b>${f} su 20</b>.</p>
    <p>${msg}</p>
    <div class="actions"><button id="again">Gioca ancora</button></div></div>`;
  document.getElementById("again").onclick=resetAll;
}

function resetAll(){ S={solved:{},tries:{},help:{}}; save(); idle(); }
document.getElementById("reset").onclick=()=>{ if(confirm("Cancellare tutte le risposte e ricominciare?")) resetAll(); };

idle();
</script>
